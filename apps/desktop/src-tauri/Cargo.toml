[package]
name = "sorvex-desktop"
version = "0.1.0"
description = "Experimental desktop GUI for Sorvex"
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# Same major as the webkit2gtk that wry uses, so its types match the webview Tauri hands out.
webkit2gtk = "2.0.2"
